site_name: Geodesix Documentation
site_url: https://github.com/normanhnchen/Geodesix

theme:
  name: material
  custom_dir: overrides
  features:
    navigation.footer: true

docs_dir: ../docs

nav:
- Home: index.md
- License: license.md
- Documentation:
  - The Camera:
    - The_Camera/Overview.md
  - Foundations:
    - Foundations/General_Relativity.md
    - Foundations/Riemannian_Geometry.md
    - Foundations/Manifolds.md
    - Foundations/The_Metric.md
    - Coordinate Systems:
      - Foundations/Coordinate_Systems/Overview.md
      - Foundations/Coordinate_Systems/Transformations.md
  - Black Holes:
    - Black_Holes/Overview.md
    - Black_Holes/Frame-Dragging.md
    - Black_Holes/Schwarzschild_Black_Holes.md
    - Black_Holes/Kerr_Black_Holes.md
    - Black_Holes/Doppler_Shifts.md
    - Black_Holes/Redshifts.md
  - Rays:
    - Rays/Overview.md
    - Rays/Coordinate_Systems.md
    - Rays/Coordinate_Transformations.md
  - Vulkan:
    - Vulkan/Overview.md
    - Vulkan/Resource_Acquisition_Is_Initialization.md
    - Vulkan/The_Vulkan_Instance.md
    - Vulkan/Validation_Layers.md
    - Vulkan/The_Physical_Device.md
    - Vulkan/Queues.md
    - Vulkan/The_Logical_Device.md
    - Vulkan/Window_Surface.md
    - Vulkan/The_Swap_Chain.md
    - Vulkan/Image_Views.md
    - Vulkan/Pipelines.md
    - Vulkan/Shaders.md
    - Vulkan/Fixed-Functions.md
    - Vulkan/Dynamic_States.md
    - Vulkan/Commands.md
    - Vulkan/Semaphores.md
    - Vulkan/Fences.md
    - Vulkan/Frames_In_Flight.md

markdown_extensions:
  # Protects LaTeX equations wrapped in `$` or `$$` from Markdown processing
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  # ---- LaTeX math support ----
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# Remove the broken search bar
plugins: []
